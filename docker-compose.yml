services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ucof-app
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: mongodb
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-ucof}
    volumes:
      - ./:/var/www/html
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(extension_loaded(\"mongodb\") ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ucof

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: ucof-nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ucof

  mongodb:
    build:
      context: .
      dockerfile: docker/mongodb/Dockerfile
    container_name: ucof-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-root}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-ucof}
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ucof

volumes:
  mongodb-data:

networks:
  ucof:
    driver: bridge
